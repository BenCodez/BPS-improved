name: Tests

on:
  push:
  pull_request:

jobs:
  python:
    name: Python ${{ matrix.python-version }} compile + unit tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: pip install -r requirements_test.txt
      - name: Byte-compile the integration
        run: python -m py_compile custom_components/bps/*.py
      - name: Run unit tests
        run: pytest tests/ -q

  javascript:
    name: JS syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: node --check the frontend
        run: |
          node --check custom_components/bps/frontend/script.js
          node --check custom_components/bps/frontend/bps-map-card.js
          node --check custom_components/bps/frontend/outdoor.js
          node --check custom_components/bps/frontend/diagnostics.js
      - name: Run frontend tests
        run: node --test tests/frontend/*.test.cjs
