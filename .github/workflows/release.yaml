name: Release

on:
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  release-zip:
    name: Build and attach bps.zip
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ github.event.release.tag_name }}

      - name: Create bps.zip
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: python3 scripts/build_release.py "$RELEASE_TAG" "$RUNNER_TEMP/bps.zip"

      - name: Upload bps.zip to release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ runner.temp }}/bps.zip
          fail_on_unmatched_files: true
